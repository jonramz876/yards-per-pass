# .github/workflows/data-refresh.yml
name: Nightly Data Refresh

on:
  schedule:
    # All crons are UTC. GitHub starts scheduled runs hours late (2-6h in Sept 2026), so instead of
    # timing one run we run every 4 hours in season: new nflverse data lands within ~4h, whatever the delay.
    # Year-round slot. March-August it only does the offseason skip + keepalive, same as before.
    - cron: '17 13 * * *'                  # 13:17 UTC = 9:17 AM EDT / 8:17 AM EST
    # Extra in-season slots, January-February and September-December only.
    # 01:17 / 05:17 / 09:17 / 17:17 / 21:17 UTC
    #   = 9:17 PM (prev day) / 1:17 AM / 5:17 AM / 1:17 PM / 5:17 PM EDT
    #   = 8:17 PM (prev day) / 12:17 AM / 4:17 AM / 12:17 PM / 4:17 PM EST (after Nov 1)
    - cron: '17 1,5,9,17,21 * 1-2,9-12 *'
  workflow_dispatch:
    inputs:
      season:
        description: 'Season to refresh (default: current)'
        required: false
        default: ''
      force:
        description: 'Run even if nflverse has nothing new (also re-runs the schema steps)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write  # keepalive step re-enables this workflow to reset GitHub's 60-day inactivity auto-disable

# Only one refresh at a time (scheduled or manual). A run that arrives while another is going waits for it
# to finish; it is never cancelled mid-run. If several pile up, only the newest waiting run is kept,
# which is fine because every run downloads the latest nflverse file.
# The skip-unchanged state (restore -> ingest -> save, below) depends on this group: it is what makes a
# queued run restore the state the previous run saved. Do not remove it.
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check for offseason
        id: offseason
        if: github.event_name == 'schedule'
        run: |
          MONTH=$(date +%m)
          # NFL offseason: March through August (no new data; keepalive step still runs)
          if [ "$MONTH" -ge 3 ] && [ "$MONTH" -le 8 ]; then
            echo "::notice::NFL offseason (month $MONTH) — skipping refresh"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve season
        if: steps.offseason.outputs.skip != 'true'
        id: vars
        run: |
          INPUT="${{ github.event.inputs.season }}"
          if [ -n "$INPUT" ]; then
            echo "season=$INPUT" >> $GITHUB_OUTPUT
          else
            # Auto-detect: NFL season starts in September
            MONTH=$(date +%m)
            YEAR=$(date +%Y)
            if [ "$MONTH" -ge 9 ]; then
              echo "season=$YEAR" >> $GITHUB_OUTPUT
            else
              echo "season=$((YEAR - 1))" >> $GITHUB_OUTPUT
            fi
          fi

      # What the last successful refresh read (nflverse file digests, schedule rows, code hash), so a run
      # with nothing new never touches the database. The key is new on every run and never matches;
      # restore-keys picks the newest saved state. A miss (first run, or GitHub evicted it after 7 unused
      # days) just means a normal full run.
      - name: Restore refresh state
        if: steps.offseason.outputs.skip != 'true'
        continue-on-error: true  # a cache outage must never stop the refresh: no state = a full run
        uses: actions/cache/restore@v4
        with:
          path: .ingest-state
          key: ingest-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ingest-state-

      - name: Run ingest
        id: ingest
        if: steps.offseason.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}  # reads nflverse release digests without the anonymous rate limit
        run: |
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE="--force"
          fi
          python scripts/ingest.py --season "${{ steps.vars.outputs.season }}" --state-file .ingest-state/state.json $FORCE

      # Skipped when ingest says nothing changed (changed=false). Ingest keeps changed=true until a POST
      # has succeeded after the last data change, which is why a 200 is recorded in revalidated_at.
      - name: Trigger ISR revalidation
        if: success() && steps.offseason.outputs.skip != 'true' && steps.ingest.outputs.changed != 'false'
        run: |
          if [ -z "${{ secrets.SITE_URL }}" ]; then
            echo "::notice::SITE_URL not configured — skipping revalidation (site may not be deployed yet)"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.SITE_URL }}/api/revalidate" \
            -H "x-revalidate-secret: ${{ secrets.REVALIDATE_SECRET }}" \
            -H "Content-Type: application/json")
          echo "Revalidation response: HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            mkdir -p .ingest-state
            date -u +%Y-%m-%dT%H:%M:%SZ > .ingest-state/revalidated_at
          else
            echo "::warning::ISR revalidation failed with HTTP $STATUS — site may serve stale data (the next run will try again)"
          fi

      # Ingest removes the state file when it cannot trust or write it. Saving nothing would let the next
      # run restore an OLDER cached state that might still match, so save an empty one instead: it claims
      # nothing, and the next run is a full run. (The text is STATE_TOMBSTONE in scripts/ingest.py.)
      - name: Leave an empty state if the run left none
        if: always() && steps.offseason.outputs.skip != 'true'
        run: |
          mkdir -p .ingest-state
          if [ ! -s .ingest-state/state.json ]; then
            echo '{"version": 1, "seasons": {}}' > .ingest-state/state.json
          fi

      # After the revalidate step, so its marker is saved too. always(): a failed ingest may still have
      # committed schedule rows, and the next run must know a revalidate is owed.
      - name: Save refresh state
        if: always() && steps.offseason.outputs.skip != 'true'
        continue-on-error: true  # a failed save only costs the next run a full run
        uses: actions/cache/save@v4
        with:
          path: .ingest-state
          key: ingest-state-${{ github.run_id }}-${{ github.run_attempt }}

      # GitHub disables cron schedules after 60 days without repo activity (this bit us June 2026).
      # Re-enabling the workflow via the API on every run resets that timer. Must run year-round.
      - name: Keep scheduled workflow alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/data-refresh.yml/enable"
